name: tao-train-centerpose
network_arch: centerpose
automl_enabled: true
container_image: tao_toolkit.pyt
data_format: default
gpu_spec_key: train.num_gpus
actions:
  train:
    command: centerpose train -e {config_path}
    config_format: yaml
    inputs:
      dataset.train_data:
        type: folder
      dataset.val_data:
        type: folder
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  evaluate:
    command: centerpose evaluate -e {config_path}
    config_format: yaml
    inputs:
      dataset.test_data:
        type: folder
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  export:
    command: centerpose export -e {config_path}
    config_format: yaml
    inputs: {}
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  inference:
    command: centerpose inference -e {config_path}
    config_format: yaml
    inputs:
      dataset.inference_data:
        type: folder
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  gen_trt_engine:
    container_image: nvcr.io/nvidia/tao/tao-toolkit:6.26.3-deploy
    command: centerpose gen_trt_engine -e {config_path}
    config_format: yaml
    inputs:
      gen_trt_engine.onnx_file:
        type: file
      gen_trt_engine.trt_engine:
        type: file
    outputs:
      results_dir:
        type: folder
      gen_trt_engine.trt_engine:
        type: file
    upload_excludes:
    - inputs/
data_sources: {}
spec_params: {}
key_defaults: {}
spec_shorthand_keys:
  num_epochs: train.num_epochs
  batch_size: dataset.batch_size
  learning_rate: train.optim.lr
description: CenterPose for keypoint / pose estimation. Detects object centers and regresses keypoint locations. Used for
  6-DoF object pose estimation.
