name: tao-train-oneformer
network_arch: oneformer
automl_enabled: true
container_image: tao_toolkit.pyt
data_format: coco_panoptic
gpu_spec_key: train.num_gpus
actions:
  train:
    command: oneformer train -e {config_path}
    config_format: yaml
    inputs:
      dataset.train.images:
        type: folder
      dataset.train.annotations:
        type: file
      dataset.label_map:
        type: file
      dataset.train.panoptic:
        type: folder
      dataset.val.images:
        type: folder
      dataset.val.annotations:
        type: file
      dataset.val.panoptic:
        type: folder
      dataset.test.images:
        type: folder
      train.pretrained_backbone:
        type: file
        optional: true
      train.pretrained_model:
        type: file
        optional: true
      train.resume_training_checkpoint_path:
        type: file
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  quantize:
    command: oneformer quantize -e {config_path}
    config_format: yaml
    inputs:
      dataset.train.images:
        type: folder
      dataset.train.annotations:
        type: file
      dataset.label_map:
        type: file
      dataset.train.panoptic:
        type: folder
      dataset.val.images:
        type: folder
      dataset.val.annotations:
        type: file
      dataset.val.panoptic:
        type: folder
      dataset.test.images:
        type: folder
      dataset.quant_calibration_dataset.images_dir:
        type: folder
      quantize.model_path:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  evaluate:
    command: oneformer evaluate -e {config_path}
    config_format: yaml
    inputs:
      dataset.train.images:
        type: folder
      dataset.label_map:
        type: file
      dataset.train.annotations:
        type: file
      dataset.train.panoptic:
        type: folder
      dataset.val.images:
        type: folder
      dataset.val.annotations:
        type: file
      dataset.val.panoptic:
        type: folder
      dataset.test.images:
        type: folder
      dataset.test.annotations:
        type: file
      dataset.test.panoptic:
        type: folder
      evaluate.checkpoint:
        type: file
      evaluate.trt_engine:
        type: file
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  export:
    command: oneformer export -e {config_path}
    config_format: yaml
    inputs:
      export.checkpoint:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  inference:
    command: oneformer inference -e {config_path}
    config_format: yaml
    inputs:
      dataset.train.images:
        type: folder
      dataset.label_map:
        type: file
      dataset.train.annotations:
        type: file
      dataset.train.panoptic:
        type: folder
      dataset.val.images:
        type: folder
      dataset.val.annotations:
        type: file
      dataset.val.panoptic:
        type: folder
      dataset.test.images:
        type: folder
      inference.images_dir:
        type: folder
      inference.checkpoint:
        type: file
      inference.trt_engine:
        type: file
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
data_sources: {}
spec_params:
  train:
    results_dir: output_dir
    train.pretrained_model: ptm_if_no_resume_model
    train.resume_training_checkpoint_path: resume_model
  evaluate:
    results_dir: output_dir
    evaluate.checkpoint: parent_model
    evaluate.trt_engine: parent_model
  export:
    results_dir: output_dir
    export.checkpoint: parent_model
  inference:
    results_dir: output_dir
    inference.checkpoint: parent_model
    inference.trt_engine: parent_model
  quantize:
    results_dir: output_dir
    quantize.model_path: parent_model
key_defaults: {}
spec_shorthand_keys:
  num_epochs: train.num_epochs
  batch_size: dataset.batch_size
  learning_rate: train.optim.lr
description: OneFormer for universal image segmentation. Unifies panoptic, instance, and semantic segmentation with a single
  architecture using task-conditioned queries.
