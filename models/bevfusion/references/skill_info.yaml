name: bevfusion
network_arch: bevfusion
automl_enabled: true
automl_blocked_reason: default TAO 7.0.0 RC images mapped by versions.yaml do not include mmdet3d; provide a BEVFusion image with mmdet3d or update the image mapping before running AutoML.
container_image: tao_toolkit.pyt
data_format: default
gpu_spec_key: train.num_gpus
actions:
  dataset_convert:
    command: bevfusion dataset_convert -e {config_path}
    config_format: yaml
    inputs:
      root_dir:
        type: folder
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  train:
    command: bevfusion train -e {config_path}
    config_format: yaml
    inputs:
      dataset.root_dir:
        type: folder
      dataset.train_dataset.ann_file:
        type: file
      dataset.val_dataset.ann_file:
        type: file
      dataset.test_dataset.ann_file:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  evaluate:
    command: bevfusion evaluate -e {config_path}
    config_format: yaml
    inputs: {}
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  inference:
    command: bevfusion inference -e {config_path}
    config_format: yaml
    inputs: {}
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
data_sources: {}
spec_params: {}
key_defaults: {}
spec_shorthand_keys:
  num_epochs: train.num_epochs
  batch_size: dataset.batch_size
  learning_rate: train.optim.lr
description: BEVFusion for multi-sensor 3D object detection. Fuses LiDAR point clouds and camera images in bird's-eye-view
  (BEV) space. Used in autonomous driving for robust 3D perception.
