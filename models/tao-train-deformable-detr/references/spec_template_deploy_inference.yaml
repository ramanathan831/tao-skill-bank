encryption_key: tlt_encode
results_dir: /results
dataset:
  infer_data_sources:
    image_dir:
    - /data/images
    classmap: /data/label_map.txt
  num_classes: 91
  batch_size: 1
  workers: 8
inference:
  trt_engine: /results/deformable-detr.engine
  conf_threshold: 0.5
  input_width: 640
  input_height: 640
  color_map:
    person: green
model:
  num_feature_levels: 4
  dec_layers: 6
  enc_layers: 6
  num_queries: 300
  num_select: 300
  with_box_refine: true
  aux_loss: true
  dim_feedforward: 1024
  return_interm_indices:
  - 1
  - 2
  - 3
  - 4
