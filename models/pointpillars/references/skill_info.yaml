name: pointpillars
network_arch: pointpillars
automl_enabled: true
container_image: tao_toolkit.pyt
data_format: default
gpu_spec_key: train.num_gpus
actions:
  dataset_convert:
    command: pointpillars dataset_convert -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  train:
    command: pointpillars train -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      model.pretrained_model_path:
        type: file
        optional: true
      train.resume_training_checkpoint_path:
        type: file
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  prune:
    command: pointpillars prune -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      prune.model:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  evaluate:
    command: pointpillars evaluate -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      evaluate.checkpoint:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  retrain:
    command: pointpillars train -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      train.pruned_model_path:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  export:
    command: pointpillars export -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      export.checkpoint:
        type: file
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
  inference:
    command: pointpillars inference -e {config_path}
    config_format: yaml
    inputs:
      dataset.data_path:
        type: folder
      dataset.data_info_path:
        type: folder
      inference.checkpoint:
        type: file
      inference.trt_engine:
        type: file
        optional: true
    outputs:
      results_dir:
        type: folder
    upload_excludes:
    - inputs/
data_sources: {}
spec_params:
  dataset_convert:
    results_dir: output_dir
  train:
    results_dir: output_dir
    model.pretrained_model_path: ptm_if_no_resume_model
    train.resume_training_checkpoint_path: resume_model
  prune:
    results_dir: output_dir
    prune.model: parent_model
  evaluate:
    results_dir: output_dir
    evaluate.checkpoint: parent_model
  retrain:
    results_dir: output_dir
    train.pruned_model_path: parent_model
  export:
    results_dir: output_dir
    export.checkpoint: parent_model
  inference:
    results_dir: output_dir
    inference.checkpoint: parent_model
    inference.trt_engine: parent_model
key_defaults: {}
spec_shorthand_keys:
  num_epochs: train.num_epochs
  batch_size: train.batch_size
  learning_rate: train.lr
description: PointPillars for 3D object detection from LiDAR point clouds. Encodes point clouds into a pseudo-image via pillar-based
  representation, then applies 2D detection. Used in autonomous driving / robotics.
