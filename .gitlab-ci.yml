include:
  # NV-ACES Tier 1/2 skill quality evaluation
  - project: 'astra/skill-eval-ci'
    file: '/templates/skill-eval.yml'
    ref: 'main'

  # End-to-end skill execution eval (runs each skill's eval.config on a real GPU runner).
  # Supports plugin-workflow-eval type: any change inside a dir listed in
  # eval.config's `skills_dir[]` triggers the workflow eval.
  - project: 'nvidia-tao-toolkit/skill-eval'
    ref: master
    file: '/ci/skill-execution-eval.yml'

# Per-backend fan-out for the skill-eval runtime. Each entry spawns a
# matrix job named `skill-exec-eval: [<backend>]` with a Runtime-tagged
# MR comment. Trim the list to run a single backend (e.g. [claude] only).
skill-exec-eval:
  tags:
    - omnistation_with_L40S_GPU
  variables:
    SKILL_EVAL_REF: master
  parallel:
    matrix:
      - SKILL_EVAL_BACKENDS: [claude, codex]

# Same fan-out for the slow-manual variant — two matrix jobs, both gated
# by `when: manual` in the template. Click the one you need in the UI.
"[Manual] skill-exec-eval-slow":
  tags:
    - omnistation_with_L40S_GPU
  variables:
    SKILL_EVAL_REF: master
  parallel:
    matrix:
      - SKILL_EVAL_BACKENDS: [claude, codex]

# Placeholder job so .post stage (used by NV-ACES) can run.
# Replace with your own CI jobs as needed.
nv_aces_placeholder:
  stage: test
  image: alpine:3.20
  script:
    - echo "NV-ACES skill evaluation enabled"
