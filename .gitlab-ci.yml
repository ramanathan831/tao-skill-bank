# Stages declared up front so includes that bring in extra ones (the
# container-mode template adds `detect` + `eval`) don't clobber `test`
# used by `validate-skills` / `nv_aces_placeholder`.
stages:
  - detect
  - eval
  - test
  - .post

include:
  # NV-ACES Tier 1/2 skill quality evaluation
  - project: 'astra/skill-eval-ci'
    file: '/templates/skill-eval.yml'
    ref: 'main'

  # End-to-end skill execution eval — CONTAINER MODE.
  # The runtime is the pre-built `nvcr.io/nvstaging/tao/skill-eval:latest`
  # image; the eval runner only needs docker + auth/env files. Pipeline
  # is split into:
  #   - `detect-changed-skills` on a normal runner (cheap)
  #   - `skill-exec-eval` on the GPU runner (only fires when changes exist)
  - project: 'nvidia-tao-toolkit/skill-eval'
    ref: master
    file: '/ci/skill-execution-eval-container.yml'

# --------- LEGACY (omnistation venv-based skill-eval) — kept for reference. ---------
# To re-enable: uncomment the include below + the skill-exec-eval matrix block,
# and comment out the container-mode include above.
#
#   - project: 'nvidia-tao-toolkit/skill-eval'
#     ref: master
#     file: '/ci/skill-execution-eval.yml'
#
# skill-exec-eval:
#   tags:
