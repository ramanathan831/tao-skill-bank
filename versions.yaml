# versions.yaml — single source of truth for TAO container images.
#
# Skills reference these by dotted key in their `references/skill_info.yaml`
# `container_image` field. CI bumps RC versions by editing this file; downstream
# skills resolve their image at runtime via `tao_sdk.versions.resolve_image()`.
#
# Both forms are valid in skill_info.yaml:
#   container_image: tao_toolkit.pyt                                 # key reference (preferred)
#   container_image: nvcr.io/nvidia/tao/tao-toolkit:6.26.3-pyt       # absolute path (also valid)
#
# Use absolute paths for experimental images, third-party registries, or one-off
# skills not worth adding here. Add to this file when the image will be used by
# more than one skill OR will be bumped on a release cadence.
#
# Wheels are NOT pinned here. `nvidia-tao-sdk` and `nvidia-tao-automl` aren't
# published to public PyPI yet; each skill's Preflight section declares the
# explicit `pip install "...[<extra>] @ git+https://..."` direct-URL command
# it needs. This keeps install instructions co-located with the skills that
# require them and avoids a central pin that resolves to a non-existent wheel.

images:
  tao_toolkit:
    pyt:                nvcr.io/nvidia/tao/tao-toolkit:6.26.3-pyt
    deploy:             nvcr.io/nvidia/tao/tao-toolkit:6.26.3-deploy
    data_services:      nvcr.io/nvidia/tao/tao-toolkit:6.26.3-data-services
    cosmos_rl:          nvcr.io/nvidia/tao/tao-toolkit:6.26.3-cosmos-rl
    cosmos_predict_2_5: nvcr.io/nvidia/tao/tao-toolkit:6.26.3-cosmos-predict-2.5
    cosmos_embed:       nvcr.io/nvidia/tao/tao-toolkit:6.26.3-cosmos-embed
    vila:               nvcr.io/nvidia/tao/tao-toolkit:6.26.3-vila

  metropolis_sdg:
    cosmos_anomalygen: nvcr.io/nv-metropolis-dev/metropolis-sdg/cosmos-anomalygen:1.0.3-006434bb.main
