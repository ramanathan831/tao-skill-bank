type: workflow
prerequisites:
  required:
  - name: kpi_dataset_uri
    description: S3 URI of KPI/validation dataset
  - name: platform
    description: Compute backend (lepton, brev)
  optional:
  - name: train_dataset_uri
    description: Initial training data (triggers SFT before loop)
  - name: init_checkpoint
    description: Initial model checkpoint
  - name: mining_source_csv
    description: Source pool CSV for k-NN mining arm
  - name: mining_source_images
    description: Source pool images directory
  - name: iteration_count
    description: 'Max DEFT iterations (default: 3)'
  - name: kpi_target
    description: Target KPI (e.g., 'FAR < 0.5 at 100% recall')
  - name: continual_model
    description: 'Chain checkpoints (default: true)'
  - name: continual_dataset
    description: 'Accumulate training data (default: true)'
  - name: arms
    description: 'SDG arms to enable: anomalygen, omniverse, mining (default: all available)'
iteration_defaults:
  count: 3
  continual_model: true
  continual_dataset: true
stages:
  init:
  - name: zero_shot_inference
    skill: visual-changenet
    action: inference
    type: gpu
  - name: threshold_optimization
    skill: vcn-threshold-optimize
    action: compute
    type: cpu
  - name: zero_shot_eval
    skill: vcn-gap-analysis
    action: analyze
    type: cpu
  - name: sft_training
    skill: visual-changenet
    action: train
    type: gpu
    conditional: train_dataset_uri provided
  - name: sft_inference
    skill: visual-changenet
    action: inference
    type: gpu
    conditional: after sft_training
  - name: sft_threshold
    skill: vcn-threshold-optimize
    action: compute
    type: cpu
    conditional: after sft_inference
  - name: sft_eval
    skill: vcn-gap-analysis
    action: analyze
    type: cpu
    conditional: after sft_threshold
  iteration:
  - name: rca
    skill: rca-changenet
    type: agent-native
  - name: gap_analysis
    skill: vcn-gap-analysis
    action: analyze
    type: cpu
  - name: source_pool_expansion
    skill: vcn-source-pool
    action: expand
    type: cpu
  - name: embed_target
    skill: siglip-embed
    action: embed
    type: gpu
  - name: embed_source
    skill: siglip-embed
    action: embed
    type: gpu
  - name: knn_mining
    skill: knn-mining
    action: mine
    type: gpu
  - name: augmentation_anomalygen
    skill: anomalygen
    action: inference
    type: gpu
    conditional: arm anomalygen enabled
  - name: augmentation_omniverse
    skill: omniverse-sdg
    action: generate
    type: gpu
    conditional: arm omniverse enabled
  - name: data_prep
    skill: changenet-data-prepare
    action: prepare
    type: cpu
  - name: merge_training_csv
    skill: vcn-merge-csv
    action: merge
    type: cpu
  - name: training
    skill: visual-changenet
    action: train
    type: gpu
  - name: inference
    skill: visual-changenet
    action: inference
    type: gpu
  - name: threshold_optimization
    skill: vcn-threshold-optimize
    action: compute
    type: cpu
  - name: evaluation
    skill: vcn-gap-analysis
    action: analyze
    type: cpu
  - name: kpi_check
    skill: analyze-kpi
    type: agent-native
tags:
- pcb
- aoi
- defect
- deft
- changenet
- mining
- anomalygen
- omniverse
- visual-inspection
