# SDG Missing Component Pipeline Config
pipeline_type: missing

# --- Scene ---
scene: omniverse://10.63.172.135/Projects/PEGATRON_AOI/dgx-spark-P4242-A04/temp_scene.usd
output: /home/horde/pcb-aoi/sdg_test_output/missing_image
num_triggers: 1

# --- Camera & Render ---
camera_path: /World/camera_light/Camera
camera_xform_path: /World/camera_light
ring_light_root: /World/camera_light/aoi_ring_light
resolution: [1920, 1080]
horizontal_aperture: 200.0

# --- PathTracing ---
pathtracing:
  spp: 1
  total_spp: 32

# --- Scan Grid ---
scan_grid:
  x_start: 21.6
  x_end: -106
  y_start: 23.2
  y_end: -77
  step: 10  # 10mm step size
  z: 0

# --- PCBA & Component Types ---
pcba_root: /World/pcba_main_s_detail/PCBA/tn__60014242BASEA04_fM9E
component_types:
  - _0201_H030
  - _0201_H040
  - _0201_LARGE_H040
  - _0402_H040
  - _0402_H060
  - _0402_LARGE_H070
  - _0603_H060
  - _0603_H070
  - _0603_H100
  - _0805U_H070
  - _0805U_H150
  - _0805U_H160
  - _1206U_H080
  - _1206U_H180
  - _1210U_H280
  - _2010_D_H110
  - _2512_C_H090
  - _2512_C_H220
  - IND_SMD_0603_B_H100
  - IND_SMD_0603_H100
  - IND_SMD_0805_H110
  - IND_SMD_2520_D_H120
  - IND_SMD_2520_G_H120

# --- Missing Defect ---
missing:
  ratio: 0.5                    # fraction of component pool to hide per trigger

# --- Lighting Randomization ---
lighting:
  ring_light: true
  exposure_range: [0.01, 1.0]
  cone_angle_range: [90, 150]
  cone_softness_range: [0.5, 1.0]

  layers:
    Inner_Red:
      intensity: [5000, 8000]
      color_r: [0.95, 1.0]
      color_g: [0.0, 0.05]
      color_b: [0.0, 0.05]
    Middle_Green:
      intensity: [2000, 4000]
      color_r: [0.0, 0.05]
      color_g: [0.95, 1.0]
      color_b: [0.0, 0.05]
    Outer_Blue:
      intensity: [3000, 6000]
      color_r: [0.0, 0.05]
      color_g: [0.0, 0.05]
      color_b: [0.95, 1.0]

  white_light:
    intensity: [3000, 8000]
    color_r: [0.8, 1.0]
    color_g: [0.8, 1.0]
    color_b: [0.8, 1.0]

# --- Camera Randomization ---
camera_rotation:
  x_range: [-5, 5]
  y_range: [-5, 5]
  z_fixed: -90

# --- Augmentation ---
augmentation:
  motion_blur:
    probability: 0.8
    alpha_range: [0.01, 0.3]
    kernel_choices: [5, 7]

# --- Writer ---
# Two-pass output: reference/ and defective/ under each trigger folder
writer:
  # Reference pass (all components visible — missing components have defect=missing semantic)
  reference:
    rgb: false
    image_output_format: png
    component_level_segmentation: false
    semantic_segmentation: true
    colorize_semantic_segmentation: true
    instance_id_segmentation: false
    bounding_box_2d_tight: true
    bounding_box_2d_loose: false
    bounding_box_3d: false
    distance_to_camera: false
    distance_to_image_plane: false
    semantic_types: [class, defect]
    frame_padding: 4

  # Defective pass (missing components hidden)
  defective:
    rgb: true
    image_output_format: png
    component_level_segmentation: false
    semantic_segmentation: false
    instance_id_segmentation: false
    bounding_box_2d_tight: false
    bounding_box_2d_loose: false
    bounding_box_3d: false
    distance_to_camera: false
    distance_to_image_plane: false
    frame_padding: 4
