network_arch: knn-mining
container_image: nvcr.io/nvidian/iva/mining:latest
required_credentials: []
actions:
  mine:
    command: python nearest_neighbors.py
    mode: args
    num_gpus: 1
    inputs:
      source-parquet:
        type: file
      target-parquet:
        type: file
    outputs:
      output-parquet:
        type: file
    args:
      source-parquet: '{source_parquet}'
      target-parquet: '{target_parquet}'
      output-parquet: '{output_parquet}'
      topn: '{topn}'
      knn-metric: '{knn_metric}'
      source-embed-column-name: embedding
      target-embed-column-name: embedding
    defaults:
      topn: 5
      knn_metric: cosine
tags:
- mining
- similarity
- knn
- nearest-neighbor
- cuml
